[build]
  publish = "."
  command = ""
  # A commit that only changes README.md skips the deploy (saves build credits)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README.md'"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# 2026-10-10: the Theme Pack's "Planet of the day" wallpaper (theme.nomansskyhub.app) reads
# today's survey data and planet pictures from here, so they may be loaded from other sites
[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
[[headers]]
  for = "/hd/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
