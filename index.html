function makePlanets(DAILY_SEED){
  // ── Seeded PRNG (Mulberry32) ───────────────────────────────────────────
  function mulberry32(seed){
    let s=seed>>>0;
    return function(){
      s=(s+0x6D2B79F5)>>>0;
      let t=Math.imul(s^(s>>>15),1|s);
      t=(t+Math.imul(t^(t>>>7),61|t))^t;
      return((t^(t>>>14))>>>0)/4294967296;
    };
  }
  function pick(r,a){return a[Math.floor(r()*a.length)];}
  function ri(r,lo,hi){return lo+Math.floor(r()*(hi-lo+1));}

  const PR=Array.from({length:8},(_,i)=>mulberry32(DAILY_SEED*31+i*1337+i*i*17));

const fetchWeatherData = (lat, lon, city) => {
  const url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + lat + "&longitude=" + lon
    + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,precipitation"
    + "&daily=temperature_2m_max,temperature_2m_min,weather_code,sunrise,sunset,uv_index_max"
    + "&hourly=temperature_2m,weather_code,precipitation_probability&forecast_days=7&timezone=auto";
  return fetch(url)
    .then(r => r.json())
    .then(data => {
      const c = data.current;
      const fmtT = iso => iso ? iso.split("T")[1].slice(0,5) : "--:--";
      const nowH = new Date(c.time).getHours();
      let si = 0;
      for (let k = 0; k < data.hourly.time.length; k++) {
        if (new Date(data.hourly.time[k]).getHours() === nowH) { si = k; break; }
      }
      const hourly = data.hourly.time.slice(si, si + 12).map((t, i) => ({
        hour: i === 0 ? "NOW" : new Date(t).getHours().toString().padStart(2,"0"),
        icon: wmoIcon(data.hourly.weather_code[si + i]),
        temp: Math.round(data.hourly.temperature_2m[si + i])
      }));
      return {
        city, temp: Math.round(c.temperature_2m), feels: Math.round(c.apparent_temperature), weatherCode: c.weather_code, windDir: Math.round(c.wind_direction_10m||0),
        condition: wmoCondition(c.weather_code), humidity: c.relative_humidity_2m,
        wind: Math.round(c.wind_speed_10m), uv: Math.round((data.daily.uv_index_max || [])[0] || 0),
        visibility: 10, pressure: Math.round(c.surface_pressure || 1013),
        precip: Math.round((c.precipitation || 0) * 10) / 10,
        sunrise: fmtT(data.daily.sunrise[0]), sunset: fmtT(data.daily.sunset[0]),
        rainProb: (data.hourly.precipitation_probability || []).slice(si, si + 4),
        nextCodes: (data.hourly.weather_code || []).slice(si + 1, si + 4),
        hourly,
        forecast: data.daily.time.map((d, i) => ({
          day: DAY_NAMES[new Date(d).getDay()], icon: wmoIcon(data.daily.weather_code[i]),
          high: Math.round(data.daily.temperature_2m_max[i]),
          low:  Math.round(data.daily.temperature_2m_min[i])
        }))
      };
    });
};

// --- Weather alerts (rain-soon / severe-weather push notifications) ---
// Codes per WMO_COND above. "Severe" = active thunderstorm / heavy rain / heavy snow right now.
const SEVERE_CODES = [65, 75, 82, 86, 95, 96, 99];
const RAIN_CODES   = [51, 53, 55, 61, 63, 65, 80, 81, 82, 95, 96, 99];
const RAIN_PROB_THRESHOLD = 55; // % chance next hour before we bother the user

// Fires a real OS notification. Android Chrome throws on `new Notification(...)` directly —
// it requires going through the active service worker's showNotification(), so try that first
// and only fall back to the plain constructor for browsers (mainly desktop) that support it.
function fireNotification(title, options) {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  options = Object.assign({ icon: '/icon-192.png', badge: '/icon-192.png' }, options || {});
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(function(reg){
      if (reg && reg.showNotification) return reg.showNotification(title, options);
      try { new Notification(title, options); } catch (e) {}
    }).catch(function(){ try { new Notification(title, options); } catch (e) {} });
  } else {
    try { new Notification(title, options); } catch (e) {}
  }
}

// Looks at freshly-fetched weather data and fires a real alert if conditions warrant it.
// Dedupe is handled via lastAlertKey (kept in App state) so repeated 15-min refreshes with
// the same situation don't re-notify every time — only escalations / new cities do.
function checkWeatherAlerts(wx, prefs, lastAlertKey, setLastAlertKey) {
  if (!wx || !prefs) return;
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const cityTag = (wx.city || '').toUpperCase();

  if (prefs.severe && SEVERE_CODES.indexOf(wx.weatherCode) !== -1) {
    const key = cityTag + '|severe|' + wx.weatherCode;
    if (lastAlertKey !== key) {
      fireNotification('\u25c8 SEVERE WEATHER \u2014 ' + cityTag, {
        body: (wx.condition || 'Severe weather') + ' active right now.',
        tag: 'atlas-severe'
      });
      setLastAlertKey(key);
    }
    return;
  }

  const nextProb = (wx.rainProb && wx.rainProb.length > 1) ? wx.rainProb[1] : null;
  const alreadyRaining = RAIN_CODES.indexOf(wx.weatherCode) !== -1;
  if (prefs.rain && !alreadyRaining && nextProb !== null && nextProb >= RAIN_PROB_THRESHOLD) {
    const key = cityTag + '|rain|' + Math.round(nextProb / 10);
    if (lastAlertKey !== key) {
      fireNotification('\u25c8 RAIN INCOMING \u2014 ' + cityTag, {
        body: 'Possible rain within the hour (' + nextProb + '% chance).',
        tag: 'atlas-rain'
      });
      setLastAlertKey(key);
    }
  }
}

// --- Closed-app push notifications (needs a VAPID key + a small backend — not active yet) ---
// Everything client-side is ready to go. To fully activate real push delivery even when the app
// is completely closed (not just backgrounded), Tony needs to:
//   1. Generate a VAPID key pair, e.g. `npx web-push generate-vapid-keys`
//   2. Paste the PUBLIC key into VAPID_PUBLIC_KEY below — that's the only edit needed here.
//   3. Stand up a small endpoint (a Netlify Function works fine) that (a) stores each subscription
//      object this code sends it, and (b) on a schedule, checks the forecast per stored subscription
//      and POSTs a web-push payload to any that show rain/severe conditions coming up.
// Until a key is pasted in below, this whole block is inert and has zero effect on the app —
// notifications while the app is open/backgrounded (the alert system above) work today regardless.
const VAPID_PUBLIC_KEY = ''; // <-- paste your VAPID public key here to activate closed-app push

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

function subscribeToPush() {
  if (!VAPID_PUBLIC_KEY || !('serviceWorker' in navigator) || !('PushManager' in window)) return Promise.resolve(null);
  return navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription().then(function(existing){
      if (existing) return existing;
      return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    });
  }).then(function(sub){
    // TODO once the backend endpoint above exists: POST `sub` (JSON.stringify(sub)) to it here
    // so the server knows where to deliver future pushes for this device.
    return sub;
  }).catch(function(e){ console.warn('Push subscribe failed', e); return null; });
}

function PlanetOrb({ type, size }) {
  var s = size || 100;
  var orb = BIOME_ORB[type] || BIOME_ORB["Dead"];
  var img = PLANET_ORB_IMG[type] || PLANET_ORB_IMG["Dead"];
  var glowFar = orb.glow.replace(/[\d.]+\)$/, "0.22)");
  return (
    <div style={{
      position:"absolute", left:"50%", top:"45%",
      transform:"translate(-50%,-50%)",
      width:s+"px", height:s+"px", borderRadius:"50%",
      overflow:"hidden",
      boxShadow:"0 0 40px "+orb.glow+",0 0 90px "+glowFar+",0 0 0 1px "+orb.rim,
      zIndex:1, pointerEvents:"none"
    }}>
      {img
        ? <img src={img} className="orb-spin" style={{width:"110%",height:"110%",objectFit:"contain",display:"block",marginTop:"-5%",marginLeft:"-5%",filter:type==="Radioactive"?"saturate(1.8) brightness(1.1)":"none"}}/>
        : <div style={{width:"100%",height:"100%",background:orb.grad}}/>
      }
    </div>
  );
}

function compassDir(d){var cc=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];return cc[Math.round((((d||0)%360)+360)%360/22.5)%16];}
function WeatherParticles({ code, windDir, wind, temp, precip, isNight }) {
  var isSnow    = (code >= 71 && code <= 77) || code === 85 || code === 86;
  var isRain    = (!isSnow) && ((code >= 51 && code <= 82) || code >= 95) && ((precip||0) > 0);
  var isHeavy   = code === 65 || code === 82 || code >= 95;
  var isThunder = code >= 95;
  var isFog     = code === 45 || code === 48;
  var isClear   = code <= 1;
  var isWindy   = (wind || 0) > 30 && !isRain && !isSnow;
  var isHot     = (temp || 15) > 32 && !isRain && !isSnow;
  var isCold    = (temp || 15) < 0 && !isRain && !isSnow && !isFog;
  var isOvercast = (code === 2 || code === 3);
  if (!isSnow && !isRain && !isFog && !isClear && !isWindy && !isHot && !isCold && !isOvercast) return null;
  var wdRad    = ((windDir || 0) * Math.PI) / 180;
  var windTilt = Math.round(8 + Math.sin(wdRad) * 10);
  var rainCount = isHeavy ? 80 : 22;
  // Depth layers: [sizeMult, opacityMult, speedMult]
  var L = [[0.62,0.45,1.55],[1.0,0.78,1.0],[1.42,1.0,0.68]];
  var pts = [];
  // Overcast / partly cloudy wisps
  if (isOvercast) {
    for (var i = 0; i < 6; i++) {
      var ow=210+(i*65)%190, oh=Math.round(ow*0.25+i*4);
      var ol=(i*18+4)%82, ot=8+(i*14)%52;
      var odel=((i*0.9)%5).toFixed(1), odur=((11+(i*3)%9)).toFixed(1);
      pts.push(<div key={"oc"+i} style={{position:"absolute",left:ol+"%",top:ot+"%",width:ow+"px",height:oh+"px",borderRadius:"50%",background:"radial-gradient(ellipse,rgba(140,170,200,0.07) 0%,rgba(100,140,175,0.03) 55%,transparent 75%)",animation:"fogDrift "+odur+"s ease-in-out "+odel+"s infinite alternate",pointerEvents:"none"}}/>);
    }
  }
  // Clear/sunny effects (day) or starfield (night)
  if (isClear && !isNight) {
    for (var i = 0; i < 8; i++) {
      var ang = i * 45;
      var rlen = 55 + (i % 3) * 22;
      pts.push(<div key={"ray"+i} style={{position:"absolute",top:"6%",left:"50%",width:"1px",height:rlen+"px",background:"linear-gradient(rgba(255,220,60,0.4),transparent)",transform:"rotate("+ang+"deg)",transformOrigin:"0 0",animation:"sunRay "+(2.5+(i*0.4)%1.5).toFixed(1)+"s ease-in-out "+(i*0.3).toFixed(2)+"s infinite alternate",pointerEvents:"none",filter:"blur(1px)"}}/>);
    }
    for (var i = 0; i < 5; i++) {
      var sl=(i*19+7)%88, st=5+(i*12)%40;
      pts.push(<div key={"glow"+i} style={{position:"absolute",left:sl+"%",top:st+"%",width:"2px",height:"2px",borderRadius:"50%",background:"rgba(255,230,80,0.8)",boxShadow:"0 0 6px rgba(255,200,50,0.9)",animation:"sunGlow "+(1.8+(i*0.3)%1).toFixed(1)+"s ease-in-out "+(i*0.4).toFixed(2)+"s infinite alternate",pointerEvents:"none"}}/>);
    }
  } else if (isClear && isNight) {
    for (var i = 0; i < 26; i++) {
      var nsl=(i*13+5)%94, nst=6+(i*17.3)%88, nsz=(i%4===0?2:1);
      pts.push(<div key={"star"+i} style={{position:"absolute",left:nsl+"%",top:nst+"%",width:nsz+"px",height:nsz+"px",borderRadius:"50%",background:"rgba(220,235,255,0.85)",boxShadow:"0 0 "+(nsz+2)+"px rgba(190,215,255,0.75)",animation:"sunGlow "+(1.6+(i*0.23)%2.2).toFixed(1)+"s ease-in-out "+(i*0.18).toFixed(2)+"s infinite alternate",pointerEvents:"none"}}/>);
    }
  }
  // Wind streak effects
  if (isWindy) {
    for (var i = 0; i < 18; i++) {
      var wt=8+(i*5.3)%83, wl=40+(i*19.7)%90, wdl=((i*0.09)%0.85).toFixed(2), wo=(0.10+(i%4)*0.05).toFixed(2);
      pts.push(<div key={"wk"+i} style={{position:"absolute",left:"-50px",top:wt+"%",width:wl+"px",height:"1px",background:"linear-gradient(transparent,rgba(200,230,255,"+wo+"),transparent)",animation:"windStreak "+(0.45+(i*0.07)%0.4).toFixed(2)+"s linear "+wdl+"s infinite",pointerEvents:"none"}}/>);
    }
  }
  // Heat shimmer effects
  if (isHot) {
    for (var i = 0; i < 6; i++) {
      var hl=10+(i*15)%70;
      pts.push(<div key={"ht"+i} style={{position:"absolute",left:hl+"%",bottom:"0",width:"10px",height:"90px",background:"linear-gradient(transparent,rgba(255,100,0,0.05),rgba(255,160,0,0.09),transparent)",animation:"heatRise "+(3+(i*0.6)%2).toFixed(1)+"s ease-in-out "+(i*0.5).toFixed(2)+"s infinite",filter:"blur(3px)",pointerEvents:"none"}}/>);
    }
  }
  // Cold sparkle effects
  if (isCold) {
    for (var i = 0; i < 22; i++) {
      var cl=(i*5.1+i*i*0.3)%97, ct=10+(i*4.7)%75, csz=1+(i%3);
      pts.push(<div key={"ck"+i} style={{position:"absolute",left:cl+"%",top:ct+"%",width:csz+"px",height:csz+"px",borderRadius:"50%",background:"rgba(180,220,255,0.75)",boxShadow:"0 0 "+(csz+2)+"px rgba(160,210,255,0.85)",animation:"coldSpark "+(2+(i*0.17)%1.4).toFixed(1)+"s ease-in-out "+(i*0.12).toFixed(2)+"s infinite alternate",pointerEvents:"none"}}/>);
    }
  }
  if (isSnow) {
    for (var i = 0; i < 40; i++) {
      var lyr = L[i % 3];
      var left  = (i * 2.63 + i * i * 0.17) % 100;
      var delay = (i * 0.14) % 3.2;
      var sz    = Math.max(1, Math.round(lyr[0] * (2 + (i % 3))));
      var dur   = ((3.2 + (i * 0.18) % 2.6) / lyr[2]).toFixed(1);
      var sx    = (8 + (i % 5) * 5) * (i % 2 === 0 ? 1 : -1);
      pts.push(<div key={i} style={{
        position:"absolute", left:left+"%", top:"-24px",
        width:sz+"px", height:sz+"px", borderRadius:"50%",
        background:"rgba(218,240,255,"+(Math.round(lyr[1]*88)/100)+")",
        boxShadow:"0 0 "+(sz+2)+"px rgba(195,232,255,0.65)",
        animation:"snowDrift "+dur+"s ease-in-out "+delay.toFixed(2)+"s infinite",
        "--sx":sx+"px", opacity:lyr[1], pointerEvents:"none"
      }}/>);
    }
  } else if (isFog) {
    for (var i = 0; i < 14; i++) {
      var lyr = L[i % 3];
      var bw  = 160 + (i * 43) % 250;
      var bh  = Math.round(bw * (0.28 + (i % 4) * 0.08));
      var left = (i * 7.7 + 3) % 92;
      var top  = 5 + (i * 7.3) % 82;
      var delay = ((i * 0.65) % 5.5).toFixed(1);
      var dur  = ((9 + (i * 1.4) % 8) / lyr[2]).toFixed(1);
      var op   = ((0.10 + (i % 4) * 0.04) * lyr[1]).toFixed(2);
      pts.push(<div key={i} style={{
        position:"absolute", left:left+"%", top:top+"%",
        width:bw+"px", height:bh+"px", borderRadius:"50%",
        background:"radial-gradient(ellipse,rgba(155,195,220,"+op+") 0%,rgba(100,155,190,"+(op*0.4).toFixed(2)+") 45%,transparent 70%)",
        animation:"fogDrift "+dur+"s ease-in-out "+delay+"s infinite alternate",
        transform:"scale("+lyr[0]+")", transformOrigin:"center", pointerEvents:"none"
      }}/>);
    }
  } else if (isRain) {
    for (var i = 0; i < rainCount; i++) {
      var lyr = L[i % 3];
      var left  = (i * 1.29 + i * i * 0.07) % 100;
      var delay = ((i * 0.035) % 1.5).toFixed(2);
      var ht    = Math.round(lyr[0] * (isHeavy ? 14+(i%6)*2 : 8+(i%5)));
      var wid   = (Math.round(lyr[0] * (isHeavy ? 2.0 : 1.5) * 10) / 10).toFixed(1);
      var rdur  = ((isHeavy ? 0.28+(i*0.007)%0.14 : 0.52+(i*0.016)%0.32) / lyr[2]).toFixed(2);
      var op    = ((isHeavy ? 0.60 : 0.42) * lyr[1]).toFixed(2);
      var angle = windTilt + (i % 3 - 1) * 2;
      pts.push(<div key={i} style={{
        position:"absolute", left:left+"%", top:"-32px",
        width:wid+"px", height:ht+"px",
        background:"linear-gradient(transparent,rgba(125,195,255,"+op+"))",
        animation:"rainFall "+rdur+"s linear "+delay+"s infinite",
        "--ra":angle+"deg", pointerEvents:"none"
      }}/>);
    }
    if (isHeavy) pts.push(<div key="sheet" style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,transparent,rgba(80,135,200,0.04) 45%,rgba(80,135,200,0.07))",pointerEvents:"none"}}/>);
  }
  return (
    <div style={{position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none",
      WebkitMaskImage:"linear-gradient(to bottom,black 60%,transparent 100%)",
      maskImage:"linear-gradient(to bottom,black 60%,transparent 100%)"}}>
      {pts}
      {isThunder && <div style={{position:"absolute",inset:0,background:"rgba(200,220,255,0.75)",animation:"lightning 7s ease-in-out 1.5s infinite",pointerEvents:"none"}}/>}
    </div>
  );
}

function SnowOverlay() {
  var flakes = [];
  for (var i = 0; i < 18; i++) {
    var left  = (i * 5.8 + i * i * 0.35) % 100;
    var sz    = 2 + (i % 3);
    var dur   = 2.4 + (i * 0.22) % 2.2;
    var delay = (i * 0.17) % 1.8;
    flakes.push(
      <div key={i} style={{
        position:"absolute", left:left+"%", top:"-10px",
        width:sz+"px", height:sz+"px", borderRadius:"50%",
        background:"rgba(222,242,255,0.92)",
        boxShadow:"0 0 4px rgba(195,232,255,0.8)",
        animation:"snowFall "+dur+"s linear "+delay+"s infinite",
        pointerEvents:"none"
      }}/>
    );
  }
  return <div style={{position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none",zIndex:1}}>{flakes}</div>;

var BIOME_PARTICLES = {
  "Frozen":     { type:"snow",  count:22, color:"rgba(200,235,255,0.88)", glow:"rgba(195,232,255,0.7)" },
  "Toxic":      { type:"rain",  count:30, color:"rgba(120,255,40,0.72)",  glow:null },
  "Lush":       { type:"rain",  count:18, color:"rgba(130,190,255,0.55)", glow:null },
  "Scorched":   { type:"ash",   count:18, color:"rgba(255,130,20,0.75)",  glow:"rgba(255,80,0,0.5)"  },
  "Radioactive":{ type:"fog",   count:7,  color:"rgba(170,255,40,0.16)",  glow:null },
  "Dead":       { type:"fog",   count:6,  color:"rgba(70,70,60,0.11)",    glow:null },
  "Marsh":      { type:"fog",   count:7,  color:"rgba(50,130,90,0.14)",   glow:null },
  "Volcanic":   { type:"ash",   count:22, color:"rgba(255,50,0,0.82)",    glow:"rgba(255,30,0,0.55)" },
};

function BiomeParticles({ type }) {
  var c = BIOME_PARTICLES[type] || BIOME_PARTICLES["Dead"];
  var pts = [];
  var isEmber = c.type === "ash" && (type === "Volcanic" || type === "Scorched");
  var containerStyle = {position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none"};
  if (type === "Toxic") containerStyle.boxShadow = "inset 0 0 70px rgba(60,210,10,0.13)";
  // Frozen: large background depth flakes
  if (type === "Frozen") {
    for (var j = 0; j < 6; j++) {
      var bleft = (j * 16.3 + 5) % 88;
      var bsz   = 10 + (j % 3) * 3;
      var bsx   = (j % 2 === 0 ? 7 : -7);
      pts.push(<div key={"bg"+j} style={{
        position:"absolute", left:bleft+"%", top:"-20px",
        width:bsz+"px", height:bsz+"px", borderRadius:"50%",
        background:"rgba(200,230,255,0.12)", boxShadow:"0 0 10px rgba(185,220,255,0.18)",
        animation:"snowDrift "+(5+j*0.9)+"s ease-in-out "+(j*0.8)+"s infinite",
        "--sx":bsx+"px", pointerEvents:"none"
      }}/>);
    }
  }
  for (var i = 0; i < c.count; i++) {
    var left  = (i * 3.71 + i * i * 0.19) % 100;
    var delay = (i * 0.13) % 2.2;
    var sz    = 2 + (i % 3);
    var dur   = 2.2 + (i * 0.09) % 2.0;
    if (c.type === "snow") {
      var sx = (6 + (i%4)*3) * (i%2===0?1:-1);
      pts.push(<div key={i} style={{
        position:"absolute", left:left+"%", top:"-10px",
        width:sz+"px", height:sz+"px", borderRadius:"50%",
        background:c.color, boxShadow:c.glow ? "0 0 4px "+c.glow : "none",
        animation:"snowDrift "+dur+"s ease-in-out "+delay+"s infinite", "--sx":sx+"px"
      }}/>);
    } else if (c.type === "rain") {
      var h = 8 + (i % 8);
      pts.push(<div key={i} style={{
        position:"absolute", left:left+"%", top:"-14px",
        width:"1.5px", height:h+"px", background:c.color,
        animation:"rainFall "+(0.7+(i*0.04)%0.8)+"s linear "+delay+"s infinite", "--ra":"10deg"
      }}/>);
    } else if (c.type === "ash") {
      var eSz  = 2 + (i % 5);
      var goUp = isEmber && (i % 3 === 0);
      pts.push(<div key={i} style={{
        position:"absolute", left:left+"%",
        top:goUp?"auto":"-10px", bottom:goUp?"-10px":"auto",
        width:eSz+"px", height:eSz+"px", borderRadius:"30%",
        background:c.color,
        boxShadow:c.glow ? "0 0 "+(eSz+2)+"px "+c.glow : "none",
        filter:isEmber && i%3===1 ? "blur(0.5px)" : "none",
        animation:(goUp?"emberRise":"snowFall")+" "+(dur+(goUp?1.2:0.8))+"s linear "+delay+"s infinite"
      }}/>);
    } else if (c.type === "fog") {
      var fw = 80 + (i * 23) % 120;
      var fh = Math.round(fw * (0.32 + (i%3)*0.08));
      pts.push(<div key={i} style={{
        position:"absolute", left:(i*13)%88+"%", top:(12+(i*11)%68)+"%",
        width:fw+"px", height:fh+"px", borderRadius:"50%",
        background:"radial-gradient(ellipse,"+c.color+" 0%,transparent 70%)",
        animation:"fogDrift "+(4+(i*0.5)%4)+"s ease-in-out "+delay+"s infinite alternate"
      }}/>);
    }
  }
  return <div style={containerStyle}>{pts}</div>;
}

function ShareBar({ city }) {
  var [copied, setCopied] = React.useState(false);
  var base = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
  var shareUrl = base + '?city=' + encodeURIComponent(city);
  var tweet = '◈ ATLAS WEATHER — ' + city.toUpperCase() + ' · Real weather translated into NMS biomes · ' + shareUrl;
  function copyLink() {
    var done = function(){ setCopied(true); setTimeout(function(){ setCopied(false); }, 2500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareUrl).then(done).catch(function(){
        var ta=document.createElement('textarea'); ta.value=shareUrl; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
      });
    } else {
      var ta=document.createElement('textarea'); ta.value=shareUrl; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
    }
  }
  return (
    <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginTop:10,paddingTop:10,borderTop:'1px solid rgba(0,229,255,0.07)'}}>
      <span style={{fontSize:8,color:'rgba(0,229,255,0.38)',letterSpacing:3,fontFamily:"'Share Tech Mono',monospace"}}>◈ SHARE:</span>
      <button style={{fontSize:9,padding:'5px 12px',letterSpacing:2,background:'rgba(0,229,255,0.06)',border:'1px solid rgba(0,229,255,0.25)',color:'#00e5ff',cursor:'pointer',fontFamily:"'Share Tech Mono',monospace",transition:'all 0.2s'}} onClick={copyLink}>
        {copied ? '✓ LINK COPIED' : '◈ COPY LINK'}
      </button>
      <a href={'https://x.com/intent/tweet?text=' + encodeURIComponent(tweet)} target="_blank" rel="noreferrer"
         style={{fontSize:9,padding:'5px 12px',letterSpacing:2,background:'rgba(0,229,255,0.06)',border:'1px solid rgba(0,229,255,0.25)',color:'#00e5ff',textDecoration:'none',fontFamily:"'Share Tech Mono',monospace"}}>
        ↗ X / TWITTER
      </a>
      <a href={'https://reddit.com/submit?url=' + encodeURIComponent(shareUrl)} target="_blank" rel="noreferrer"
         style={{fontSize:9,padding:'5px 12px',letterSpacing:2,background:'rgba(0,229,255,0.06)',border:'1px solid rgba(0,229,255,0.25)',color:'#00e5ff',textDecoration:'none',fontFamily:"'Share Tech Mono',monospace"}}>
        ↗ REDDIT
      </a>
    </div>
  );
}

          }).catch(function() { setLoading(false); });
      }
    } catch(e) {}
  }, []);

  // Show alerts banner on first visit
  useEffect(function() {
    try {
      if (!localStorage.getItem('atlas-alerts-seen') && typeof Notification !== 'undefined' && Notification.permission !== 'granted') {
        setAlertsBanner(true);
      }
    } catch(e) {}
  }, []);

  // Warp plays as GIF in tile; open modal after animation completes
  useEffect(function() {
    if (!warping) return;
    var t = setTimeout(function() { setWarping(false); setModal(true); }, 6100);
    return function() { clearTimeout(t); };
  }, [warping]);

  const applyWeather = (wx, lat, lon, city) => {
    setWeather(wx);
    setLastLoc({ lat: lat, lon: lon, city: city || wx.city });
    setLastUpdated(new Date());
    checkWeatherAlerts(wx, alertPrefs, lastAlertKey, setLastAlertKey);
  };

  const refreshWeather = () => {
    if (!lastLoc || refreshing) return;
    setRefreshing(true);
    fetchWeatherData(lastLoc.lat, lastLoc.lon, lastLoc.city)
      .then(function(wx){ setWeather(wx); setLastUpdated(new Date()); setRefreshing(false); checkWeatherAlerts(wx, alertPrefs, lastAlertKey, setLastAlertKey); })
      .catch(function(){ setRefreshing(false); });
  };

  const doSearch = (q) => {
    setLoading(true); setLocErr("");
    forwardGeocode(q)
      .then(geo => {
        if (!geo) { setLocErr("LOCATION NOT FOUND"); setLoading(false); return; }
        fetchWeatherData(geo.lat, geo.lon, geo.city)
          .then(wx => { applyWeather(wx, geo.lat, geo.lon, geo.city); setLocInput(""); setLoading(false); if(typeof Notification!=='undefined'&&Notification.permission==='granted') try{fireNotification('\u25c8 ATLAS WEATHER \u2014 '+(wx.city||'').toUpperCase(),{body:Math.round(wx.temp)+'\u00b0C \u00b7 '+(wx.condition||''),icon:'/icon-192.png'})}catch(e){} })
          .catch(() => { setLocErr("SIGNAL LOST"); setLoading(false); });
      })
      .catch(() => { setLocErr("SIGNAL LOST"); setLoading(false); });
  };

  const tryIPLocate = () => {
    setLoading(true); setLocErr("");
    fetch("https://ipapi.co/json/")
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.latitude && d.longitude) {
          return fetchWeatherData(d.latitude, d.longitude, d.city || d.region || "Unknown")
            .then(function(wx){ applyWeather(wx, d.latitude, d.longitude, d.city || d.region || "Unknown"); setLoading(false); if(typeof Notification!=='undefined'&&Notification.permission==='granted') try{fireNotification('\u25c8 ATLAS WEATHER \u2014 '+(wx.city||'').toUpperCase(),{body:Math.round(wx.temp)+'\u00b0C \u00b7 '+(wx.condition||''),icon:'/icon-192.png'})}catch(e){} });
        }
        setLocErr("SIGNAL LOST — TYPE LOCATION MANUALLY"); setLoading(false);
      })
      .catch(function(){ setLocErr("SIGNAL LOST — TYPE LOCATION MANUALLY"); setLoading(false); });
  };

  const handleLocate = () => {
    if (!navigator.geolocation) { tryIPLocate(); return; }
    setLoading(true); setLocErr("");
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
        var _geoCity = null;
        reverseGeocode(lat, lon)
          .then(function(city){ _geoCity = city; return fetchWeatherData(lat, lon, city); })
          .then(function(wx){ applyWeather(wx, lat, lon, _geoCity); setLoading(false); if(typeof Notification!=='undefined'&&Notification.permission==='granted') try{fireNotification('\u25c8 ATLAS WEATHER \u2014 '+(wx.city||'').toUpperCase(),{body:Math.round(wx.temp)+'\u00b0C \u00b7 '+(wx.condition||''),icon:'/icon-192.png'})}catch(e){} })
          .catch(function(){ setLocErr("SIGNAL LOST"); setLoading(false); });
      },
      function() { tryIPLocate(); }
    );
  };

  useEffect(function(){
    var iv = setInterval(function(){ refreshWeather(); }, 15 * 60 * 1000);
    return function(){ clearInterval(iv); };
  }, [lastLoc, refreshing]);

  useEffect(function(){
    function onVis(){
      if (document.visibilityState === 'visible' && lastLoc && lastUpdated) {
        var ageMs = Date.now() - lastUpdated.getTime();
        if (ageMs > 10 * 60 * 1000) refreshWeather();
      }
    }
    document.addEventListener('visibilitychange', onVis);
    return function(){ document.removeEventListener('visibilitychange', onVis); };
  }, [lastLoc, lastUpdated, refreshing]);

  var ts = time.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",hour12:!military});
  var ds = time.toLocaleDateString([], {weekday:"long",year:"numeric",month:"long",day:"numeric"});
  var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "LOCAL";
  var _nextMs = lastUpdated ? Math.max(0,(lastUpdated.getTime()+15*60*1000)-time.getTime()) : 0;
  var _nm = Math.floor(_nextMs/60000);
  var _ns = Math.floor((_nextMs%60000)/1000);
  var nextUpdateStr = (_nm<10?"0":"")+_nm+":"+(_ns<10?"0":"")+_ns;
  var utcTs = time.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",timeZone:"UTC"});

  var _h    = time.getHours();
  var _srH  = parseInt((w.sunrise||"06:00").split(":")[0]);
  var _ssH  = parseInt((w.sunset||"20:00").split(":")[0]);
  var _isG  = (_h===_srH||_h===_srH+1||_h===_ssH-1||_h===_ssH);
  var _isN  = (_h < _srH || _h > _ssH+1);
  var _bg   = _isN ? "rgba(2,5,20,0.97)" : _isG ? "rgba(12,9,3,0.96)" : "rgba(0,14,26,0.94)";
  var _glow = _isN ? "0 0 40px rgba(30,50,130,0.22)" : _isG ? "0 0 40px rgba(190,90,15,0.16)" : "0 0 40px rgba(0,229,255,0.04)";

  return (
    <div>
      <style>{css}</style>
      <div className="grid-bg"/>
      <div className="scanlines"/>
      <div className="app">

        <div className="header-atlas" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18,paddingBottom:14}}>
          <div style={{display:"flex",alignItems:"flex-start",gap:14}}>
            <AtlasIcon/>
            <div>
              <div className="glow" style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,fontWeight:900,color:"#00e5ff",lineHeight:1}}>ATLAS WEATHER STATION</div>
              <div style={{fontSize:10,color:"#6699aa",marginTop:5,letterSpacing:1.5}}>NO MAN'S SKY —</div>
              <div style={{fontSize:10,color:"#6699aa",marginTop:2,letterSpacing:1.5}}>ENVIRONMENTAL MONITORING</div>
              <div style={{fontSize:9,color:"#7aadbb",marginTop:6,letterSpacing:1}}>YOUR WEATHER · TRANSLATED INTO NMS BIOMES</div>
            </div>
          </div>
          <div className="clock-block" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flex:1,paddingLeft:20}}>
            <div className="clock-local" style={{textAlign:"left"}}>
              <div style={{fontSize:9,color:"#6699aa",letterSpacing:1,marginBottom:4}}>{(w.city || tz.split('/').pop()).toUpperCase()}</div>
              <div className="glow" style={{fontSize:22,fontFamily:"'Orbitron',sans-serif",color:"#00e5ff"}}>{ts}</div>
            </div>
            <div className="clock-date" style={{textAlign:"center"}}>
              <div className="glow" style={{fontSize:14,fontFamily:"'Orbitron',sans-serif",color:"#00e5ff",whiteSpace:"nowrap"}}>{ds}</div>
            </div>
            <div className="clock-utc" style={{textAlign:"left"}}>
              <div style={{fontSize:9,color:"#6699aa",letterSpacing:1,marginBottom:4}}>UTC</div>
              <div className="glow" style={{fontSize:22,fontFamily:"'Orbitron',sans-serif",color:"#00e5ff"}}>{utcTs}</div>
            </div>
          </div>
        </div>

        <div className="loc-bar">
          <input className="loc-input" value={locInput} placeholder="ENTER CITY OR LOCATION NAME..."
            onChange={function(e){ setLocInput(e.target.value); }}
            onKeyDown={function(e){ if (e.key === "Enter" && locInput.trim()) doSearch(locInput.trim()); }}
            disabled={loading}/>
          <button className="loc-btn" onClick={function(){ if (locInput.trim()) doSearch(locInput.trim()); }} disabled={loading || !locInput.trim()}>SCAN</button>
          <button className="loc-btn" onClick={handleLocate} disabled={loading}>LOCATE</button>
        </div>
        {loading && <div className="acq" style={{textAlign:"center",marginBottom:10}}>ACQUIRING SIGNAL...</div>}
        {locErr  && <div className="loc-err">{locErr}</div>}
        <div style={{marginBottom:12}}>
          {alertsBanner ? (
            <div style={{background:"rgba(0,229,255,0.04)",border:"1px solid rgba(0,229,255,0.25)",padding:"11px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
              <div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:"#00e5ff",letterSpacing:2,marginBottom:2}}>◈ ENABLE ATLAS ALERTS</div>
                <div style={{fontSize:10,color:"#6699aa",letterSpacing:1}}>Get notified of incoming rain, severe weather, and your daily planet survey.</div>
              </div>
              <div style={{display:"flex",gap:8,flexShrink:0,alignItems:"center"}}>
                <button className="loc-btn" style={{fontSize:10,padding:"5px 12px"}} onClick={function(){
                  if(typeof Notification!=='undefined') Notification.requestPermission().then(function(p){
                    setNotifStatus(p);
                    if(p==='granted') { try{fireNotification('◈ ATLAS ALERTS ENABLED',{body:'You will be notified of rain, severe weather, and daily surveys.',icon:'/icon-192.png'})}catch(e){} subscribeToPush(); }
                  });
                  try{localStorage.setItem('atlas-alerts-seen','1')}catch(e){}
                  setAlertsBanner(false);
                }}>ENABLE</button>
                <button className="btn-r" style={{fontSize:10,padding:"5px 12px"}} onClick={function(){
                  try{localStorage.setItem('atlas-alerts-seen','1')}catch(e){}
                  setAlertsBanner(false);
                }}>NOT NOW</button>
                <button className="btn-o" style={{fontSize:10,padding:"5px 12px"}} onClick={function(){
                  if(!scanner){setPlanets(makePlanets(Date.now()));setPlanIdx(0);setWarping(false);} setScanner(!scanner); if(!scanner){setTimeout(function(){var el=document.getElementById('scanner-section');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80);}
                }}><span className="sw"/>NMS PLANET SCANNER</button>
              </div>
            </div>
          ) : (
            <div style={{display:"flex",justifyContent:"flex-end",gap:8,flexWrap:"wrap"}}>
              <button className="btn-o" style={{fontSize:10,padding:"5px 12px"}} onClick={function(){ setShowAlertPanel(!showAlertPanel); }}>
                <span className="sw"/>◈ ALERTS {notifStatus==='granted' ? '(ON)' : notifStatus==='denied' ? '(BLOCKED)' : '(OFF)'}
              </button>
              <button className="btn-o" onClick={function(){
                if(!scanner){setPlanets(makePlanets(Date.now()));setPlanIdx(0);setWarping(false);} setScanner(!scanner); if(!scanner){setTimeout(function(){var el=document.getElementById('scanner-section');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80);}
              }}><span className="sw"/>NMS PLANET SCANNER</button>
            </div>
          )}
          {showAlertPanel && (
            <div style={{marginTop:8,background:"rgba(0,229,255,0.04)",border:"1px solid rgba(0,229,255,0.25)",padding:"12px 16px"}}>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:"#00e5ff",letterSpacing:2,marginBottom:8}}>◈ ALERT SETTINGS</div>
              <div style={{fontSize:10,color:"#6699aa",letterSpacing:1,marginBottom:10}}>
                Notifications: <span style={{color: notifStatus==='granted' ? "#00ff88" : notifStatus==='denied' ? "#ff5544" : "#eedd44"}}>{notifStatus==='granted'?'ENABLED':notifStatus==='denied'?'BLOCKED BY BROWSER':'NOT ENABLED'}</span>
              </div>
              {notifStatus!=='granted' && (
                <button className="loc-btn" style={{fontSize:10,padding:"5px 12px",marginBottom:10}} onClick={function(){
                  if(typeof Notification==='undefined') return;
                  Notification.requestPermission().then(function(p){
                    setNotifStatus(p);
                    if(p==='granted') { try{fireNotification('◈ ATLAS ALERTS ENABLED',{body:'You will be notified of rain, severe weather, and daily surveys.',icon:'/icon-192.png'})}catch(e){} subscribeToPush(); }
                  });
                }}>{notifStatus==='denied' ? 'BLOCKED — CHECK BROWSER SITE SETTINGS' : 'ENABLE NOTIFICATIONS'}</button>
              )}
              <label style={{display:"flex",alignItems:"center",gap:8,fontSize:10,color:"#a8c5d6",letterSpacing:1,marginBottom:8,cursor:"pointer"}}>
                <input type="checkbox" checked={alertPrefs.rain} style={{accentColor:"#00e5ff"}} onChange={function(){ setAlertPrefs(Object.assign({},alertPrefs,{rain:!alertPrefs.rain})); }}/>
                RAIN ALERTS — possible rain within the hour
              </label>
              <label style={{display:"flex",alignItems:"center",gap:8,fontSize:10,color:"#a8c5d6",letterSpacing:1,marginBottom:8,cursor:"pointer"}}>
                <input type="checkbox" checked={alertPrefs.severe} style={{accentColor:"#00e5ff"}} onChange={function(){ setAlertPrefs(Object.assign({},alertPrefs,{severe:!alertPrefs.severe})); }}/>
                SEVERE WEATHER ALERTS — active thunderstorms, heavy rain/snow
              </label>
              <label style={{display:"flex",alignItems:"center",gap:8,fontSize:10,color:"#a8c5d6",letterSpacing:1,marginBottom:10,cursor:"pointer"}}>
                <input type="checkbox" checked={alertPrefs.daily} style={{accentColor:"#00e5ff"}} onChange={function(){ setAlertPrefs(Object.assign({},alertPrefs,{daily:!alertPrefs.daily})); }}/>
                DAILY PLANET SURVEY — midnight UTC ping
              </label>
              {notifStatus==='granted' && (
                <button className="btn-o" style={{fontSize:10,padding:"5px 12px"}} onClick={function(){ fireNotification('◈ ATLAS TEST ALERT',{body:'Notifications are working correctly.',icon:'/icon-192.png'}); }}>
                  <span className="sw"/>SEND TEST ALERT
                </button>
              )}
            </div>
          )}
        </div>


        <div style={{padding:24,marginBottom:14,background:_bg,boxShadow:_glow,position:"relative",border:"1px solid rgba(0,229,255,0.18)"}}>
          <div className="weather-top" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:16}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:18}}>
              <img src={SENTINEL_IMG} alt="Sentinel"
                   style={{width:84,height:84,objectFit:"contain",mixBlendMode:"normal",
                           filter:"drop-shadow(0 0 12px rgba(0,229,255,0.6)) brightness(1.05)"}}/>
              <div>
                <div style={{fontSize:10,color:"#6699aa",letterSpacing:3,marginBottom:6}}>LOCATION: {w.city.toUpperCase()}</div>
                <div className="glow temp-breathe main-temp" style={{fontFamily:"'Orbitron',sans-serif",fontSize:60,fontWeight:900,color:"#00e5ff",lineHeight:1}}>
                  {cvt(w.temp)}{u}
                </div>
                <div style={{fontSize:14,color:"#6699aa",marginTop:10}}>{w.condition}</div>
                <div style={{fontSize:11,color:"#6699aa",marginTop:3}}>Feels like {cvt(w.feels)}{u}</div>
              </div>
            </div>
            <div className="weather-btns" style={{position:"relative",display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",border:"1px solid rgba(0,229,255,0.18)",boxShadow:"0 0 40px rgba(0,229,255,0.04)",padding:"8px 10px",borderRadius:4,background:"rgba(0,229,255,0.03)"}}>
              <span className="corner-tr"/><span className="corner-bl"/>
              <button className="btn-o" onClick={function(){ setFahren(!fahren); }}>
                <span className="sw"/>Switch to {fahren?"°C":"°F"}
              </button>
              <button className="btn-o" onClick={function(){ setCelsius(!celsius); }}>
                <span className="sw"/>Switch to {celsius?"mph":"km/h"}
              </button>
              <button className="btn-o" onClick={function(){ setMilitary(!military); }}>
                <span className="sw"/>Switch to {military?"12-HR":"24-HR"}
              </button>
              <button className="btn-o" onClick={refreshWeather} disabled={!lastLoc || refreshing} style={{opacity:(!lastLoc||refreshing)?0.45:1,cursor:(!lastLoc||refreshing)?"default":"pointer"}}>
                <span className="sw"/>{refreshing ? "REFRESHING..." : "REFRESH"}
              </button>
              {lastUpdated && <div style={{width:1,alignSelf:"stretch",background:"rgba(0,229,255,0.18)",margin:"0 2px"}}/>}
              {lastUpdated && <div style={{marginLeft:"auto",fontSize:8,color:"#6699aa",letterSpacing:1,whiteSpace:"nowrap"}}>UPDATED {lastUpdated.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",hour12:!military})} · NEXT UPDATE IN <span style={{color:"#00e5ff"}}>{nextUpdateStr}</span></div>}
            </div>
          </div>
          <div style={{position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none",zIndex:5}}>
            <WeatherParticles code={w.weatherCode || 0} windDir={w.windDir || 0} wind={w.wind || 0} temp={w.temp || 15} precip={w.precip||0} isNight={_isN}/>
          </div>
        </div>

        <div className="stat-grid" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:8}}>
          <StatCard label="HUMIDITY"   value={w.humidity + "%"}/>
          <StatCard label="WIND SPEED" value={(celsius ? w.wind+" km/h" : Math.round(w.wind*0.621371)+" mph")+" · "+compassDir(w.windDir||0)} extra={<svg width="14" height="14" viewBox="0 0 14 14" style={{flexShrink:0,opacity:0.75}}><g transform={"rotate("+(w.windDir||0)+",7,7)"}><polygon points="7,1 10,11 7,9 4,11" fill="#00e5ff"/></g></svg>}/>
          <StatCard label="UV INDEX" value={w.uv} valueColor={w.uv<=2?"#00ff88":w.uv<=5?"#eedd44":w.uv<=7?"#ff9944":w.uv<=10?"#ff5544":"#cc44ff"}/>
          <StatCard label="VISIBILITY" value={celsius ? w.visibility+" km" : Math.round(w.visibility*0.621371)+" mi"}/>
          <StatCard label="ATMOS. PRESSURE" value={w.pressure + " hPa"}/>
          <StatCard label="RAINFALL"   value={w.precip + " mm"}    icon="|"/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          <StatCard label="SUNRISE" value={w.sunrise} icon={<span style={{fontSize:16,color:"#ffcc44",lineHeight:1}}>☀</span>}/>
          <StatCard label="SUNSET"  value={w.sunset}  icon={<span style={{fontSize:16,color:"#bbd4f5",lineHeight:1}}>☾</span>}/>
        </div>
        <ShareBar city={w.city}/>

        <Panel style={{padding:18,marginBottom:14}}>
          <div className="section-label">NEXT 12 HOURS</div>
          <div className="hourly-strip">
            {w.hourly.map(function(h,i) {
              return (
                <div key={i} className={"h-cell" + (i===0 ? " now" : "")}>
                  <div style={{fontSize:9,color:i===0?"#00e5ff":"#2a4a5a",marginBottom:4,letterSpacing:1}}>{h.hour}</div>
                  <div style={{margin:"4px 0",display:"flex",justifyContent:"center"}}><WxIcon icon={h.icon} size={28}/></div>
                  <div style={{fontSize:11,color:"#00e5ff",fontFamily:"'Orbitron',sans-serif"}}>{cvt(h.temp)}{u}</div>
                </div>
              );
            })}
          </div>
        </Panel>

        <Panel style={{padding:18,marginBottom:14}}>
          <div className="section-label">7-DAY FORECAST</div>
          <div className="fc-grid" style={{display:"flex",flexWrap:"wrap",justifyContent:"center",gap:6}}>
            {w.forecast.map(function(d,i) {
              return (
                <div key={i} className="fc-day">
                  <div style={{fontSize:10,color:"#6699aa",marginBottom:4}}>{d.day}</div>
                  <div style={{margin:"4px 0",display:"flex",justifyContent:"center"}}><WxIcon icon={d.icon} size={32}/></div>
                  <div style={{fontSize:11,color:"#00e5ff",fontFamily:"'Orbitron',sans-serif"}}>{cvt(d.high)}{u}</div>
                  <div style={{fontSize:10,color:"#7aadbb",marginTop:2}}>&#8595;{cvt(d.low)}{u}</div>
                </div>
              );
            })}
          </div>
        </Panel>

        {scanner && (<div id="scanner-section">
          <Panel className="scan-in" style={{padding:20}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div>
                <div className="glow-o" style={{fontFamily:"'Orbitron',sans-serif",fontSize:14}}>PLANETARY SCANNER</div>
                <div style={{fontSize:9,color:"#6699aa",marginTop:3,letterSpacing:2}}>WORLD {planIdx+1} OF {planets.length}</div>
                <div style={{fontSize:11,color:"#cc7700",marginTop:3,letterSpacing:1,fontFamily:"'Orbitron',sans-serif"}}>&#9670; NEW SURVEY IN {(function(){ var mn=new Date(time); mn.setHours(24,0,0,0); var s=Math.floor((mn-time)/1000); var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sc).padStart(2,"0"); })()}</div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <button className="loc-btn" onClick={function(){ cyclePlanet(-1); }} style={{padding:"4px 12px",fontSize:14}}>&#9664;</button>
                <button className="loc-btn" onClick={function(){ cyclePlanet(1); }} style={{padding:"4px 12px",fontSize:14}}>&#9654;</button>
                <button className="btn-r" onClick={function(){ setScanner(false); setWarping(false); }} style={{padding:"4px 14px",fontSize:11,letterSpacing:1}}>X CLOSE</button>
              </div>
            </div>
            <div className="planet-card" onClick={!warping ? function(){ setWarping(true); } : undefined} style={{opacity:planFade?0:1,transition:"opacity 0.15s ease",cursor:warping?"default":"pointer"}}>
              <span className="csl"/>
              <div style={{position:"relative",height:warping?280:160,overflow:"hidden",transition:"height 0.3s ease"}}>
                <img src={warping ? '/warp.gif' : (BIOME_IMG[planet.type]||BIOME_IMG["Dead"])} style={{position:"absolute",top:0,left:0,width:"100%",height:"100%",objectFit:"cover",objectPosition:"center",filter:(!warping&&planet.type==="Radioactive")?"hue-rotate(90deg) saturate(2.5) brightness(0.6) contrast(1.1)":"none"}}/>
                {!warping && <PlanetOrb type={planet.type} size={88}/>}
                {!warping && <div style={{position:"absolute",top:0,left:0,right:0,bottom:0,zIndex:2,background:"linear-gradient(to bottom,transparent 45%,rgba(0,5,12,0.98))"}}/>}
                {!warping && <div style={{position:"absolute",top:10,right:10,zIndex:4,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                  <div style={{fontSize:10,background:"rgba(0,0,0,0.82)",padding:"3px 10px",color:"#88ff44",border:"1px solid rgba(80,200,20,0.42)",letterSpacing:2}}>
                    {planet.type.toUpperCase()}
                  </div>
                  <div style={{fontSize:9,background:"rgba(0,180,60,0.14)",padding:"2px 8px",color:"#55ee88",borderLeft:"2px solid rgba(60,200,80,0.6)",letterSpacing:1}}>
                    HAZARD LV.{planet.hazardLevel}
                  </div>
                </div>}
                {!warping && <div style={{position:"absolute",bottom:10,left:14,zIndex:4,fontSize:9,fontFamily:"'Orbitron',sans-serif",color:"#00e5ff",letterSpacing:3,animation:"tapFlash 1.4s ease-in-out infinite",pointerEvents:"none"}}>▶ TAP FOR FULL SCAN</div>}

              <a href="https://nomansskyhub.app" target="_blank" rel="noreferrer" style={{display:"block",padding:"12px 16px",marginBottom:10,background:"rgba(0,229,255,0.04)",border:"1px solid rgba(0,229,255,0.2)",color:"#00e5ff",textDecoration:"none",fontSize:12,letterSpacing:1}}>&#x27C1; NMS COMMAND NETWORK (HUB)</a>
              <a href="https://nomansskyhub.app/theme" target="_blank" rel="noreferrer" style={{display:"block",padding:"12px 16px",marginBottom:10,background:"rgba(0,229,255,0.04)",border:"1px solid rgba(0,229,255,0.2)",color:"#00e5ff",textDecoration:"none",fontSize:12,letterSpacing:1}}>&#x27C1; NMS THEME PACK</a>
